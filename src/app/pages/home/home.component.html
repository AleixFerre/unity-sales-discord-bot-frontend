<div class="page">
  <div class="page__glow"></div>
  <form class="page__content" [formGroup]="composer.form" (ngSubmit)="composer.send()">
    <div class="builder">
      <header class="builder__header">
        <div>
          <p class="eyebrow">Discord Embed</p>
          <p class="subtext">
            Craft the promo message, preview it live, then ship to your bot backend.
          </p>
          <app-composer-toolbar />
        </div>
      </header>

      <section class="panel">
        <h2>Auth</h2>
        <label
          class="field"
          [class.error]="composer.form.controls.token.touched && composer.form.controls.token.invalid"
        >
          <span>Bearer token</span>
          <input type="password" formControlName="token" placeholder="••••••••••••••" autocomplete="off" />
          @if (composer.form.controls.token.touched && composer.form.controls.token.invalid) {
            <small class="error-text">Token is required.</small>
          }
        </label>
      </section>

      <div
        class="collapsible"
        style="--collapsible-gap: 1.5rem"
        [class.open]="composer.listPanelOpen()"
        [inert]="!composer.listPanelOpen()"
      >
        <div class="collapsible__inner">
          <app-unity-list-panel />
        </div>
      </div>

      <app-sale-settings />
      <app-embed-list />
    </div>

    <div class="preview">
      <div class="preview__embeds">
        @for (embed of composer.previewEmbeds(); track $index) {
          <app-embed-preview [embed]="embed" />
        }
      </div>
      <button class="primary" type="submit" [disabled]="!composer.canSubmit()">
        {{ composer.isSubmitting() ? 'Sending...' : 'Post message' }}
      </button>
      @if (composer.status(); as status) {
        <div class="status" [class.error]="status.type === 'error'">
          {{ status.text }}
        </div>
      }
    </div>
  </form>
</div>
